<!--
  REUSABLE COUNTY PAGE TEMPLATE

  Section order is fixed; the copy is not. Every county page must be written
  from that county's own facts — circuit, county seat, which counties share the
  circuit, which counties border it — and must have its own introduction and
  its own FAQs. Producing a new page by copying an existing one and swapping
  the county name creates a doorway page, which is both an SEO liability and,
  because it implies a local presence the firm has not claimed, a Fla. Bar Rule
  4-7.13 problem.

  Never write into a county page: courthouse names or addresses, judges,
  division assignments, filing procedures, local rules, or hearing schedules.
  None of that is verifiable from this repository. Use the marked placeholder
  block and let someone with local knowledge fill it in.

  Verified per-county facts live in data/locations.json.
-->
