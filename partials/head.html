<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.titleTag}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{page.canonical}}">
{{page.robots}}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/styles.css">
<link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/source-serif-4-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/source-serif-4-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.siteName}}">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{page.titleTag}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.canonical}}">
<meta property="og:image" content="{{page.ogImage}}">
<meta property="og:image:width" content="{{site.openGraph.imageWidth}}">
<meta property="og:image:height" content="{{site.openGraph.imageHeight}}">
<meta property="og:image:alt" content="{{site.openGraph.imageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.titleTag}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{page.ogImage}}">
<meta name="twitter:image:alt" content="{{site.openGraph.imageAlt}}">
<meta name="theme-color" content="#1c3a63">
<meta name="format-detection" content="telephone=no">
{{page.schema}}
{{page.analytics}}
